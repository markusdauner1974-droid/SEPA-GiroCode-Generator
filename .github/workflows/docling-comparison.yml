name: Docling OCR Vergleich
on:
  push:
    branches: [test/docling-vergleich]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Testwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libpoppler-glib-dev libtesseract-dev tesseract-ocr-deu jq img2pdf
      - name: Docling.rs und Modelle vorbereiten
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/docling.tar.gz https://github.com/docling-project/docling.rs/releases/download/v2.86.14/docling-rs-v2.86.14-x86_64-unknown-linux-gnu.tar.gz
          echo '7823f2dda8a8e7ea6c0e8b6f9cf36d09766c72b36ba560055eaaf267e8234c90  /tmp/docling.tar.gz' | sha256sum -c -
          mkdir -p /tmp/docling-bin
          tar -xzf /tmp/docling.tar.gz -C /tmp/docling-bin
          find /tmp/docling-bin -type f -name docling-rs -exec cp {} /tmp/docling-rs \;
          test -x /tmp/docling-rs
          git clone --depth 1 --branch v2.86.14 https://github.com/docling-project/docling.rs.git /tmp/docling-src
          /tmp/docling-src/scripts/install/download_dependencies.sh --no-asr --no-chunk --no-int8
          du -sh .models
      - name: Anonyme digitale Rechnung und Scan erstellen
        run: |
          mkdir -p test-output
          cp tests/docling-comparison/blau-digital.pdf test-output/digital.pdf
          cp tests/docling-comparison/scan-rot-erschwert.png test-output/scan.png
          img2pdf test-output/scan.png -o test-output/scan.pdf
          pdftotext test-output/digital.pdf test-output/poppler.txt
      - name: Digitale PDF und Scan erkennen
        run: |
          set -euo pipefail
          /usr/bin/time -o test-output/docling-pdf-zeit.txt -f '%e s' /tmp/docling-rs --text-layer-only --to json test-output/digital.pdf > test-output/docling-pdf.json
          # v2.86.14 only accepts en/ch as language codes, but documents that
          # the multilingual PP-OCRv6 model is preferred when present.
          test -f .models/ocr_rec_v6.onnx
          test -f .models/ocr_rec_v6_dict.txt
          export DOCLING_OCR_REC_ONNX="$PWD/.models/ocr_rec_v6.onnx"
          export DOCLING_OCR_DICT="$PWD/.models/ocr_rec_v6_dict.txt"
          /usr/bin/time -o test-output/docling-scan-zeit.txt -f '%e s' /tmp/docling-rs --ocr-engine ppocr --ocr-lang en --no-table-former --to json test-output/scan.png > test-output/docling-scan.json
          /usr/bin/time -o test-output/docling-scanpdf-zeit.txt -f '%e s' /tmp/docling-rs --ocr-engine ppocr --ocr-lang en --no-table-former --force-full-page-ocr --to json test-output/scan.pdf > test-output/docling-scanpdf.json
          /usr/bin/time -o test-output/tesseract-zeit.txt -f '%e s' tesseract test-output/scan.png test-output/tesseract -l deu+eng tsv
          jq -e . test-output/docling-pdf.json >/dev/null
          jq -e . test-output/docling-scan.json >/dev/null
          grep -q 'RG-2026-104' test-output/poppler.txt
          grep -q 'RG-2026-104' test-output/docling-pdf.json
          grep -q '297,50' test-output/docling-pdf.json
          jq -r '.. | strings' test-output/docling-pdf.json > test-output/docling-pdf.txt
          jq -r '.. | strings' test-output/docling-scan.json > test-output/docling-scan.txt
          jq -r '.. | strings' test-output/docling-scanpdf.json > test-output/docling-scanpdf.txt
          cut -f 12 test-output/tesseract.tsv > test-output/tesseract.txt
          for source in docling-scan docling-scanpdf tesseract; do
            printf '\n%s\n' "$source" >> test-output/vergleich.txt
            for term in 'Jürgen Möller Heiztechnik-Solaranlagen' 'RG2026/082' '13757' '297,50' 'DE89'; do
              if tr '\n' ' ' < "test-output/$source.txt" | grep -Fqi "$term"; then
                printf '  %s: gefunden\n' "$term" >> test-output/vergleich.txt
              else
                printf '  %s: nicht gefunden\n' "$term" >> test-output/vergleich.txt
              fi
            done
            if tr -d '[:space:]' < "test-output/$source.txt" | grep -Fqi 'DE89370400440532013000'; then
              echo '  IBAN vollständig: gefunden' >> test-output/vergleich.txt
            else
              echo '  IBAN vollständig: nicht gefunden' >> test-output/vergleich.txt
            fi
          done
          cat test-output/vergleich.txt
          for f in test-output/*zeit.txt; do printf '%s: ' "$f"; cat "$f"; done
      - name: Tatsächliche GiroCode-Feldzuordnung testen
        continue-on-error: true
        run: |
          set -o pipefail
          export GIRO_TEST_IMAGE="$PWD/test-output/scan.png"
          cargo test --lib end_to_end_ocr_ergebnis -- --ignored --nocapture 2>&1 | tee test-output/girocode-felder.txt
      - name: Ergebnisse bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docling-vergleich-anonyme-rechnung
          path: test-output/
          if-no-files-found: ignore
