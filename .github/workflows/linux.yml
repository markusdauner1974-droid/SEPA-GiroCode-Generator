name: Rust auf Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - run: rustup update stable && cargo +stable test
      - run: cargo +stable build --release
      - uses: actions/upload-artifact@v4
        with:
          name: girocode-linux-x86_64
          path: target/release/rechnung-zu-girocode
