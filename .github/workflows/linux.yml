name: Rust auf Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build libpoppler-glib-dev libtesseract-dev tesseract-ocr-deu tesseract-ocr-eng
      - run: rustup update stable && cargo +stable test
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update stable
          mkdir -p .cargo
          cargo +stable vendor vendor > .cargo/config.toml
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 org.freedesktop.Sdk.Extension.rust-stable//25.08
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=flatpak-repo build-flatpak io.github.markusdauner1974_droid.SepaGiroCodeGenerator.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo SEPA-GiroCode-Generator-Plasma.flatpak io.github.markusdauner1974_droid.SepaGiroCodeGenerator
      - uses: actions/upload-artifact@v4
        with:
          name: SEPA-GiroCode-Generator-Plasma
          path: SEPA-GiroCode-Generator-Plasma.flatpak
