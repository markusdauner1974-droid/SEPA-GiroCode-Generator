[package]
name = "sepa-girocode-generator"
version = "0.1.0-alpha.1"
edition = "2021"
license = "GPL-3.0-only"

[features]
legacy-ui = ["dep:eframe", "dep:rfd"]

[lib]
crate-type = ["staticlib"]

[dependencies]
emath = "0.31.1"
serde_json = "1"
eframe = { optional = true, version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", optional = true }
poppler-rs = "0.26"
glib = "0.22"
cairo-rs = { version = "0.22", features = ["png", "pdf"] }

[[bin]]
name = "rechnung-zu-girocode"
path = "src/main.rs"
required-features = ["legacy-ui"]
